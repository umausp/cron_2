name: Fetch TikTok APK
on:
  workflow_dispatch: # This allows you to trigger it manually via a button

jobs:
  download-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Install apkeep
        run: |
          wget https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu -O apkeep
          chmod +x apkeep
          sudo mv apkeep /usr/local/bin/

      - name: Download APK from APKPure
        # Corrected the download source to 'apk-pure'
        run: apkeep -a com.zhiliaoapp.musically -d apk-pure .

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-latest-apk
          # Using a wildcard ensures we grab it even if apkeep appends a version number
          path: "*.apk"
